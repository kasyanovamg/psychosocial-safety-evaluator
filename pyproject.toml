[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "psychosocial-safety-evaluator"
version = "0.1.1"
description = "An evaluation harness for psychosocial behavior in conversational AI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
dependencies = [
    "pydantic>=2.12,<3",
    "PyYAML",
]

[project.optional-dependencies]
dev = ["pytest", "setuptools>=77", "wheel"]
ui = ["streamlit>=1.55,<2"]

[tool.setuptools]
packages = ["psych_eval", "psych_eval.integrations", "psych_eval._scenario_pack", "psych_eval._fixture_data"]
package-dir = {"" = "src", "psych_eval._scenario_pack" = "scenarios/v1/relational_sycophancy", "psych_eval._fixture_data" = "fixtures"}

[tool.setuptools.package-data]
"psych_eval._scenario_pack" = ["*.yaml"]
"psych_eval._fixture_data" = ["demo_targets/relational_sycophancy/*.yaml", "demo_judges/relational_sycophancy/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
