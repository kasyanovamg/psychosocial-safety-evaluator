[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "psych-eval-openai"
version = "0.1.1"
description = "Independent OpenAI Responses target and judge adapters for Psychosocial Safety Evaluator"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
dependencies = [
    "psychosocial-safety-evaluator>=0.1.1,<0.2",
    "pydantic>=2.12,<3",
    "openai>=3.8,<4",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.entry-points."psych_eval.targets"]
openai = "psych_eval_openai.target:build_target"

[project.entry-points."psych_eval.judges"]
openai = "psych_eval_openai.judge:build_judge"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
